# Festival Pager DNS/DHCP — Captive Portal
# Copy to: /etc/dnsmasq.d/festival-pager.conf

# Only bind to the hotspot interface
interface=wlan0

# Static IP for the Pi (gateway)
dhcp-range=10.0.0.10,10.0.0.100,255.255.255.0,12h

# Gateway
dhcp-option=3,10.0.0.1

# DNS server (the Pi itself)
dhcp-option=6,10.0.0.1

# Captive portal: redirect ALL DNS to the Pi
address=/#/10.0.0.1

# No DHCP on other interfaces
bind-interfaces

# Domain needed for captive portal detection
domain=festival-pager.local

# Short lease time for festivals (people come and go)
dhcp-lease-max=50

# Log for debugging
log-dhcp