# Festival Pager WiFi Hotspot — Atheros AR9271 (ath9k_htc)
# Copy to: /etc/hostapd/hostapd.conf
# Ensure DAEMON_CONF="/etc/hostapd/hostapd.conf" in /etc/default/hostapd

interface=wlan0
driver=nl80211
ssid=Festival Pager
hw_mode=g
channel=6
wmm_enabled=0

# Open network (captive portal handles auth via PIN)
auth_algs=1
wpa=0

# Country code for EU (enables channel 12-13 if needed)
country_code=GB

# Beacon interval (ms)
beacon_int=100

# DTIM period
dtim_period=2

# Maximum number of stations
max_num_sta=32

# Logger
logger_syslog=-1
logger_syslog_level=2